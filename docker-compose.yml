services:
  web:
    build: .
    image: my-php-apache-image
    container_name: php_apache_lat1
    ports:
      - "8443:443"
    volumes:
      - ./app:/var/www/html/app
    depends_on:
      - db

  db:
    image: postgres
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: netsec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/db.sql:/docker-entrypoint-initdb.d/db.sql
    ports:
      - "543:5432"  # Expose PostgreSQL port

volumes:
  db_data:
